<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kahoot Scraper</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #9aa1ac;
    --accent: #6c8cff;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 720px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.95rem;
  }
  input[type="text"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #status {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 12px;
    min-height: 1.2em;
  }
  #status.error {
    color: var(--error);
  }
  pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    overflow-x: auto;
    font-size: 0.85rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }
</style>
</head>
<body>
<main>
  <h1>Kahoot Scraper</h1>
  <p class="sub">Fetches raw quiz JSON via the scraper API. Enter a Kahoot quiz id.</p>

  <form id="form">
    <input type="text" id="quizId" placeholder="Quiz id, e.g. 4d0801d5-..." autocomplete="off">
    <button type="submit" id="submitBtn">Scrape</button>
  </form>

  <div id="status"></div>
  <pre id="output">Results will show up here.</pre>
</main>

<script>
  const SCRAPER_URL = "https://kahootscraper.onrender.com/scrape";

  const form = document.getElementById("form");
  const quizIdInput = document.getElementById("quizId");
  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("status");
  const outputEl = document.getElementById("output");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const quizId = quizIdInput.value.trim();

    statusEl.textContent = "";
    statusEl.classList.remove("error");

    if (!quizId) {
      statusEl.textContent = "Enter a quiz id first.";
      statusEl.classList.add("error");
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = "Fetching...";
    outputEl.textContent = "";

    try {
      const res = await fetch(`${SCRAPER_URL}?quiz_id=${encodeURIComponent(quizId)}`);
      const data = await res.json();

      if (!res.ok) {
        statusEl.textContent = `Error (${res.status}): ${data.error || "unknown error"}`;
        statusEl.classList.add("error");
        outputEl.textContent = JSON.stringify(data, null, 2);
        return;
      }

      statusEl.textContent = "Done.";
      outputEl.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      statusEl.textContent = "Request failed: " + err.message;
      statusEl.classList.add("error");
      outputEl.textContent = "";
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
